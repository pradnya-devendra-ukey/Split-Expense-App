databases:
  - name: split-expense-db
    databaseName: split_expense_db
    user: split_expense_user
    plan: free

services:
  - type: web
    name: split-expense-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: split-expense-db
          property: connectionString

